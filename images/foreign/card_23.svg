<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="skyGrad_foreign_23" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12263a" />
      <stop offset="100%" stop-color="#071019" />
    </linearGradient>
    <linearGradient id="mountGrad_foreign_23" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#284b63" />
      <stop offset="100%" stop-color="#071019" />
    </linearGradient>
    <linearGradient id="accentGrad_foreign_23" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow_foreign_23">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="533" fill="url(#skyGrad_foreign_23)" />

  <!-- Stars / Atmosphere particles -->
  <circle cx="120" cy="80" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="280" cy="110" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="450" cy="60" r="1.2" fill="#ffffff" opacity="0.4"/>
  <circle cx="680" cy="95" r="1.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="740" cy="140" r="1" fill="#ffffff" opacity="0.5"/>

  <!-- Sun / Moon glow -->
  <circle cx="650" cy="120" r="50" fill="#ff6b6b" opacity="0.15" />
  <circle cx="650" cy="120" r="30" fill="#ff6b6b" opacity="0.25" />

  <!-- Mountain Silhouettes Range 1 (Background) -->
  <polygon points="-50,380 120,240 280,360 420,210 600,380 750,230 850,380 850,533 -50,533" fill="#284b63" opacity="0.5" />

