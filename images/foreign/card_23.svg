  <polygon points="380,280 410,320 350,320" fill="#e6f2ff" opacity="0.85" />
  <polygon points="710,290 735,325 685,325" fill="#e6f2ff" opacity="0.85" />

  <!-- Foreground Valley River / Reflection -->
  <path d="M 0,533 Q 300,460 400,470 T 800,533 Z" fill="#ff6b6b" opacity="0.1" />

  <!-- Dark Bottom Vignette Overlay for Title Contrast -->
  <rect y="330" width="800" height="203" fill="url(#skyGrad_foreign_23)" opacity="0.85" />

  <!-- Location Badge Box -->
  <rect x="36" y="38" width="180" height="32" rx="16" fill="rgba(12,18,15,0.75)" stroke="#ff6b6b" stroke-width="1.5" filter="url(#shadow_foreign_23)"/>
  <text x="52" y="59" fill="#ff6b6b" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" letter-spacing="1">SAFAR SILSILA</text>

  <!-- Destination Title Overlay -->
  <text x="36" y="440" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="26" font-weight="800" filter="url(#shadow_foreign_23)">Pakistan Food Tour: A Journey of Fla...</text>
  
  <!-- Subtitle & Icon -->
  <text x="36" y="475" fill="#ff6b6b" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">🏍️ Certified Expeditions • 8 Days 7 Nights</text>
</svg>