  <polygon points="120,240 145,275 95,275" fill="#e6f2ff" opacity="0.6" />
  <polygon points="420,210 445,245 395,245" fill="#e6f2ff" opacity="0.6" />
  <polygon points="750,230 775,265 725,265" fill="#e6f2ff" opacity="0.6" />

